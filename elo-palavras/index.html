<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Palavras | Cine Nostalgia</title>
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <main class="glass-container">
        <header class="cabecalho-orbital">
            <div class="info-topo">
                <h1>Elo Palavras</h1>
                
                <div class="status-jogo">
                    <span id="nivel-display" class="badge">Fase 1</span>
                    <span class="badge moedas">
                        🪙 <span id="moedas-valor">10</span>
                    </span>
                </div>
            </div>
            <p>Conecte os clássicos do entretenimento</p>
        </header>

        <section id="tabuleiro-grid" class="tabuleiro">
            </section>

        <aside id="lista-palavras" class="painel-vidro">
            <h3>Palavras a Encontrar</h3>
            <ul id="palavras-alvo">
                </ul>
        </aside>
    </main>

    <script src="js/motor-encaixe.js"></script>
    <script src="js/interacao.js"></script>
</body>
</html>
